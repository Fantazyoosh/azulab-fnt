apiVersion: v1
kind: Namespace
metadata:
  name: azulab
  labels:
    # Pod Security Admission: the workload below satisfies the "restricted"
    # profile (non-root, no privilege escalation, all capabilities dropped,
    # RuntimeDefault seccomp). Enforcing it here means a future manifest that
    # does not will be rejected instead of silently weakening the namespace.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
