apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: azulab

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

# Baseline image tag. CD injects the immutable tag produced by the pipeline on
# every merge (`kubectl set image`); this value is what a manual
# `kubectl apply -k` uses. Keep it at the last commit that changed the app.
images:
  - name: ghcr.io/fantazyoosh/azulab-fnt
    newTag: 1c4f897b150a820e5700e6aebdf4cdd63255f57b
