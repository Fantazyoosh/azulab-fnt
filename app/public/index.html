<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azulab | Cloud Message</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0f172a; 
            color: #cbd5e1; 
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .editorial-border {
            border-top: 1px solid #334155;
            border-bottom: 1px solid #334155;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="max-w-3xl w-full">
        <!-- Header -->
        <div class="flex justify-between items-end mb-12">
            <div>
                <h1 class="text-xs uppercase tracking-[0.3em] text-slate-500 font-semibold mb-1">System Status: Operational</h1>
                <p class="text-2xl font-light text-slate-200 tracking-tight">Azulab Cloud Broadcast</p>
            </div>
            <button id="refresh-btn" class="text-xs uppercase tracking-widest text-slate-500 hover:text-white transition-colors duration-300 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                Refresh
            </button>
        </div>

        <!-- Main Message Area -->
        <div class="editorial-border py-12 mb-12 text-center">
            <div id="message-display" class="text-4xl md:text-5xl font-light text-slate-100 leading-tight transition-all duration-500">
                Loading...
            </div>
        </div>

        <!-- Input Area -->
        <div class="max-w-md mx-auto">
            <div class="relative group">
                <input type="text" id="message-input" 
                    placeholder="Enter new broadcast message..." 
                    class="w-full bg-transparent border-b border-slate-700 py-3 px-0 text-lg text-slate-200 focus:outline-none focus:border-slate-400 transition-all duration-500 placeholder:text-slate-600">
                <button id="send-btn" class="absolute right-0 bottom-3 text-xs uppercase tracking-widest text-slate-500 hover:text-white transition-colors duration-300">
                    Update
                </button>
            </div>
            <div id="source-indicator" class="mt-4 text-[10px] uppercase tracking-widest text-slate-600 mono text-center">
                Initializing...
            </div>
        </div>

        <!-- Runtime identity: which replica, node and build served this page. -->
        <div id="runtime-info" class="mt-16 pt-6 border-t border-slate-800 text-[10px] uppercase tracking-widest text-slate-600 mono text-center space-y-1">
            <div>Loading runtime info...</div>
        </div>
    </div>

    <script>
        const msgDisplay = document.getElementById('message-display');
        const msgInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const sourceInd = document.getElementById('source-indicator');
        const refreshBtn = document.getElementById('refresh-btn');

        async function updateMessage() {
            try {
                const res = await fetch('/api/message');
                const data = await res.json();
                
                const sourceLabel = data.source === 'blob' ? 'Source: Azure Blob Storage' : 'Source: Azure Key Vault';
                
                msgDisplay.classList.remove('fade-in');
                void msgDisplay.offsetWidth; // trigger reflow
                msgDisplay.innerText = data.message;
                msgDisplay.classList.add('fade-in');
                
                document.title = data.message;
                sourceInd.innerText = sourceLabel;
            } catch (err) {
                msgDisplay.innerText = "Connection Error";
                console.error(err);
            }
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            try {
                const res = await fetch('/api/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                if (res.ok) {
                    msgInput.value = '';
                    await updateMessage();
                }
            } catch (err) {
                alert("Failed to send message");
            }
        }

        sendBtn.onclick = sendMessage;
        msgInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
        refreshBtn.onclick = updateMessage;

        // Runtime identity panel. textContent (not innerHTML) so the values can
        // never be interpreted as markup, even if an env var is malformed.
        async function updateRuntimeInfo() {
            try {
                const res = await fetch('/version');
                if (!res.ok) return;
                const v = await res.json();
                const el = document.getElementById('runtime-info');
                el.replaceChildren();
                [['Pod', v.pod], ['Node', v.node], ['Namespace', v.namespace], ['Version', v.version]]
                    .forEach(([label, value]) => {
                        const row = document.createElement('div');
                        row.textContent = `${label}: ${value}`;
                        el.appendChild(row);
                    });
            } catch (_err) {
                // Non-fatal: the message area already reports connectivity.
            }
        }

        updateMessage();
        updateRuntimeInfo();
        setInterval(updateMessage, 15000);
    </script>
</body>
</html>
